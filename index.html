<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas - Padaria 2 Corações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sistema de Vendas</h1>
    <h2>Padaria 2 Corações</h2>

    <nav>
        <button onclick="mostrarTela('venda')">Registrar Venda</button>
        <button onclick="alert('Área de produtos em desenvolvimento!')">Produtos</button>
        <button onclick="alert('Consulta de vendas em desenvolvimento!')">Consultar Vendas</button>
    </nav>

    <section id="venda" hidden>
        <h2>Registrar Venda</h2>
        <label>Produto:</label>
        <input type="text" id="produto" placeholder="Nome do produto">
        <br><br>

        <label>Quantidade:</label>
        <input type="number" id="quantidade" min="1">
        <br><br>

        <label>Valor (R$):</label>
        <input type="number" id="valor" min="0.01" step="0.01">
        <br><br>

        <button onclick="salvarVenda()">Salvar Venda</button>
        <button onclick="mostrarTela('menu')">Cancelar</button>
    </section>

    <script>
        function mostrarTela(tela) {
            document.getElementById('venda').hidden = tela !== 'venda';
        }

        function salvarVenda() {
            const produto = document.getElementById('produto').value.trim();
            const quantidade = Number(document.getElementById('quantidade').value);
            const valor = Number(document.getElementById('valor').value);

            if (!produto || quantidade < 1 || valor <= 0) {
                alert('Preencha todos os campos corretamente.');
                return;
            }

            alert('Venda registrada com sucesso!');
        }
    </script>
</body>
</html>
