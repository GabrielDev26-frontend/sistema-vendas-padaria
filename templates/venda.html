<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Venda - Sistema de Vendas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Sistema de Vendas</h1>
    <h2>Registrar Venda</h2>

    {% if erro %}
    <p class="mensagem-erro" role="alert">{{ erro }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('venda') }}">
        <label for="produto">Produto:</label><br>
        <input type="text" id="produto" name="produto" placeholder="Nome do produto"
               value="{{ request.form.get('produto', '') }}">
        <br><br>

        <label for="quantidade">Quantidade:</label><br>
        <input type="number" id="quantidade" name="quantidade" min="1"
               value="{{ request.form.get('quantidade', '') }}">
        <br><br>

        <label for="valor">Valor (R$):</label><br>
        <input type="number" id="valor" name="valor" min="0.01" step="0.01"
               value="{{ request.form.get('valor', '') }}">
        <br><br>

        <button type="submit">Salvar Venda</button>
        <a href="{{ url_for('menu') }}"><button type="button">Cancelar</button></a>
    </form>

    <nav>
        <button type="button" id="contraste" aria-pressed="false" onclick="alternarContraste()">
            Ativar alto contraste
        </button>
    </nav>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
